name: Docker

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

permissions:
  contents: write

jobs:
  build-custom-mysql:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle=mysql-console-${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "image_tag=zziaguan/mysql:8.0.46-allinone" >> "$GITHUB_OUTPUT"

      - name: Build and push allinone image
        run: |
          export docker_hub_username=${{ secrets.DOCKER_USERNAME }}
          export DOCKER_BUILD_TARGET=allinone
          ./code/tools/build.sh mysql:8.0.46-allinone ./
          # 额外打一份带本次版本号的镜像标签，便于客户按版本拉取
          VERSION_TAG="${{ steps.meta.outputs.version }}"
          VERSION_TAG="${VERSION_TAG#v}"
          docker tag "${docker_hub_username}/mysql:8.0.46-allinone" \
            "${docker_hub_username}/mysql:8.0.46-allinone-${VERSION_TAG}"
          docker push "${docker_hub_username}/mysql:8.0.46-allinone-${VERSION_TAG}"

      - name: Pack customer deploy tarball
        env:
          MYSQL_IMAGE: ${{ secrets.DOCKER_USERNAME }}/mysql:8.0.46-allinone
        run: |
          chmod +x ./code/tools/pack_deploy.sh
          ./code/tools/pack_deploy.sh ./dist "${{ steps.meta.outputs.version }}"
          ls -lah ./dist

      - name: Upload deploy package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.bundle }}
          path: dist/${{ steps.meta.outputs.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attach package to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.bundle }}.tar.gz
          generate_release_notes: true
          body: |
            ## 部署包

            下载 `${{ steps.meta.outputs.bundle }}.tar.gz` 后解压即可使用：

            ```bash
            tar -xzf ${{ steps.meta.outputs.bundle }}.tar.gz
            cd ${{ steps.meta.outputs.bundle }}
            cp .env.example .env   # 修改密码后
            docker compose pull && docker compose up -d
            ```

            镜像：`${{ steps.meta.outputs.image_tag }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
