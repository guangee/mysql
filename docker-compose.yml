version: '3.8'

services:
  # 官方 minio 镜像已离开 Docker Hub。这里用 SeaweedFS 提供 S3 兼容接口，
  # 镜像经 hub.coding-space.cn 拉取。备份脚本仍通过 mc + S3 API 访问。
  minio:
    image: hub.coding-space.cn/chrislusf/seaweedfs:latest
    container_name: minio
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=0.0.0.0
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./data/minio_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "9000:9000"
    networks:
      - backup-network

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${MYSQL_CONTAINER_NAME}
    build:
      context: ./
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - minio
    env_file:
      - .env
    volumes:
      - ./data/mysql_data:/var/lib/mysql
      - ./data/mysql_config:/etc/mysql/conf.d
      - ./data/backups:/backups
      - ./shared:/shared
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backup-network
    entrypoint: ["/usr/local/bin/docker-entrypoint-with-backup.sh"]
    command:
      - --default-authentication-plugin=mysql_native_password
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --bind-address=0.0.0.0
      - --default-time-zone=+08:00
      - --binlog-expire-logs-seconds=2592000

  console:
    image: ${CONSOLE_IMAGE:-mysql-console:latest}
    container_name: mysql-console
    build:
      context: .
      dockerfile: console/Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      CONSOLE_MYSQL_HOST: mysql
      CONSOLE_MYSQL_PORT: "3306"
      PROJECT_ROOT: /app
      BACKUP_BASE_DIR: /backups
      STORAGES_CONFIG_FILE: /shared/storages.json
      BACKUP_POLICY_FILE: /shared/backup_policy.json
      MYSQL_DATA_DIR: /var/lib/mysql
      MYSQL_CONFIG_DIR: /etc/mysql/conf.d
    ports:
      - "${CONSOLE_PORT:-8888}:80"
    volumes:
      - ./shared:/shared
      - ./data/backups:/backups
      - ./data/console_data:/app/data
      - ./data/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backup-network

networks:
  backup-network:
    driver: bridge
